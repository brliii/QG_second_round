spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_lost_found?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 1234

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # Spring AI配置
  ai:
    openai:
      api-key: ${ZHIPU_API_KEY}
#      base-url: https://open.bigmodel.cn/api/paas/v4
#      chat:
#        options:
#          model: glm-4-flash
#          temperature: 0.7
#          timeout: 60000

# Mybatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.lostfound.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # ?????SQL
    map-underscore-to-camel-case: true

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时

# 文件上传路径
file:
  upload-dir: D:/uploads/

admin:
  register-secret: mySuperSecretKey123

