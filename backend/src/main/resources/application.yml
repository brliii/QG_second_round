spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_lost_found?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis??
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # Spring AI??
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: http://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
        temperature: 0.7

# Mybatis-Plus??
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.lostfound.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # ?????SQL
    map-underscore-to-camel-case: true

# JWT??
jwt:
  secret: your-jwt-secret-key-at-least-256-bits-long
  expiration: 86400000  # 24??

# ??????
file:
  upload-dir: /uploads/  # ??????????????

